name: 1A. Search Post to Comment

on:
  schedule:
    - cron: '19 18 * * *'
    - cron: '40 20 * * *'
    - cron: '43 22 * * *'
    - cron: '27 3 * * *'
    - cron: '33 18 * * *'
    - cron: '3 12 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  search-automation:
    runs-on: ubuntu-latest
    
    # CRITICAL: Permission granted for committing/pushing changes back to repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Fetches full history so dynamic pushes stay safe

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Add the repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        
        # 3. Start Service
        sudo systemctl start warp-svc
        sleep 2
        
        # 4. Register (New CLI Syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new
        
        # 5. Switch the mode from PROXY to TUN (standard VPN)
        # This routes all GitHub runner internet traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp
        
        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5
        
        # 7. Verify that the whole system IP changed
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Search Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python search_post_to_comment.py

    # =======================================================
    # ARCHIVE ERROR SCREENSHOTS IF SCRIPT FAILS
    # =======================================================
    - name: Upload Error Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore
        retention-days: 3

    # =======================================================
    # COMMIT AND PUSH STATUS & PERSISTENT STATE
    # =======================================================
    - name: Commit and Push Status Changes
      if: always() # Always runs so dynamic state is never missed
      run: |
        # Stages the exact files generated by the script, with a safety check
        [ -f json/comment_status.json ] && git add json/comment_status.json
        [ -f json/post_to_comment.json ] && git add json/post_to_comment.json
        [ -f json/commented.json ] && git add json/commented.json
        # Self-healing locators: persist recorded fixes and auto-corrected .txt fallbacks
        [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
        [ -f locators/linkedin_locators.txt ] && git add locators/linkedin_locators.txt
        [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
        
        if git diff --staged --quiet; then
          echo "[INFO] No changes detected in pipeline state files. Skipping push."
        else
          echo "[OK] Changes detected. Committing dynamic state..."
          git commit -m "Automated: Fresh target post state updated [skip ci]"
          git stash --include-untracked || true
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi
