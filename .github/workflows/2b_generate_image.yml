name: 2B. Generate Image

on:
  workflow_dispatch: # Keeps a manual-run button available in the GitHub UI
  workflow_run:
    workflows: ["2A. Generate Content"] # Triggers automatically once the first workflow finishes
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-image-automation:
    runs-on: ubuntu-latest
    # Runs only when manually triggered, or when the first workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Fetches full git history so dynamic tracking commits stay safe

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Add the repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        
        # 3. Start Service
        sudo systemctl start warp-svc
        sleep 2
        
        # 4. Register (New CLI Syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new
        
        # 5. Switch the mode from PROXY to TUN (standard VPN)
        # This routes all GitHub runner internet traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp
        
        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5
        
        # 7. Verify that the whole system IP changed
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Image Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_image.py

    - name: Upload Error Screenshot
      if: failure() # Extracts a screenshot for debugging when the image script fails
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Generated Image & Updated JSON
      run: |
        # Stage the actual targets produced by the script:
        # 1. image/image.png (default output asset directory of the script)
        # 2. json/umang_linkedin_topics.json (holds the image_generated=True update)
        git add image/image.png json/umang_linkedin_topics.json
        # Self-healing locators: persist recorded fixes and auto-corrected .txt fallbacks
        [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
        [ -f locators/linkedin_locators.txt ] && git add locators/linkedin_locators.txt
        [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
        
        if git diff --staged --quiet; then
          echo "[INFO] No image changes or state mutations detected. Skipping push."
        else
          echo "[OK] New asset or JSON update detected. Committing and pushing updates..."
          git commit -m "Automated: Update generated feed asset and tracking state [skip ci]"
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi
