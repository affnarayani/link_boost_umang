name: 2C. Post Article

on:
  workflow_dispatch: # Provides a manual-run button in the GitHub UI when needed
  workflow_run:
    workflows: ["2B. Generate Image"] # Triggers only after the 'Generate Image' workflow completes successfully
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  run-script:
    runs-on: ubuntu-latest # Linux containers give fast and efficient execution
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Check out the repository code into the runner container
      - name: Checkout repository code
        uses: actions/checkout@v5

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Configure the git identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Pull latest changes (balances race conditions and dynamic commits)
      - name: Pull Latest Changes (Maintain Persistence)
        run: |
          git pull origin ${GITHUB_REF_NAME} --rebase

      # 5. Cloudflare WARP Proxy Client Client Configuration
      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Add the repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2
          
          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new
          
          # 5. Switch the mode from PROXY to TUN (standard VPN)
          # This routes all GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp
          
          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5
          
          # 7. Verify that the whole system IP changed
          curl https://cloudflare.com/cdn-cgi/trace

      # 6. Install the Python core dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Install the Playwright drivers and binaries
      - name: Install Playwright Chromium and system dependencies
        run: |
          playwright install chromium --with-deps

      # 8. Execute the main posting script with injected secrets
      - name: Execute Automation Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python post_article.py

      # 9. Failure state recovery (captures a screenshot when the script crashes)
      - name: Upload Error Screenshot if script fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error/error_screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      # 10. Success state synchronization (state file persistence)
      - name: Commit and Push updated topics state
        if: success()
        run: |
          git add json/umang_linkedin_topics.json
          # Self-healing locators: persist recorded fixes and auto-corrected .txt fallbacks
          [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
          [ -f locators/linkedin_locators.txt ] && git add locators/linkedin_locators.txt
          [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
          if git diff --staged --quiet; then
            echo "[INFO] No changes detected in pipeline state files. Skipping push."
          else
            echo "[OK] Changes detected. Committing dynamic state..."
            git commit -m "Automated: Fresh target post state updated [skip ci]"
            
            # Temporarily stash the extra unstaged files
            git stash --include-untracked || true
            
            # Sync with the remote updates
            git pull origin ${GITHUB_REF_NAME} --rebase
            
            # Push the changes
            git push origin ${GITHUB_REF_NAME}
            
            # Restore the stashed extra files (if needed)
            git stash pop || true
          fi
