name: 1C. Like and Comment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1B. Generate Comment"] # Triggers after the 'Generate Comment' workflow completes successfully
    types:
      - completed

permissions:
  contents: write # Repository mein json state changes ko commit aur push karne ki permission deta hai

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    # Runs only when manually triggered, OR when the upstream workflow completed with conclusion 'success'
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Fetch the latest code and state from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      # 2. Configure Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Configure Git Identity Early (To avoid rebase identity conflicts)
      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Pull Latest Changes before setting up infrastructure
      - name: Pull Latest Changes
        run: |
          git pull origin ${GITHUB_REF_NAME:-main} --rebase

      # 5. Cloudflare WARP Proxy Setup
      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Add the repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          
          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2
          
          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new
          
          # 5. Switch the mode from PROXY to TUN (standard VPN)
          # This routes all GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp
          
          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5
          
          # 7. Verify that the whole system IP changed
          curl https://cloudflare.com/cdn-cgi/trace

      # 6. Install required packages from requirements.txt or raw fallbacks
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Set up Playwright Chromium browser and its system binaries
      - name: Install Playwright and System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      # 8. Run the core automation script (Clean Headless Execution)
      - name: Run LinkedIn Like and Comment Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python like_comment.py

      # 9. Archive Error Screenshot if script crashes
      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error/error_screenshot.png
          if-no-files-found: ignore
          retention-days: 3

      # 10. Commit and Push Any Changes (Safe State Sync with Stash)
      - name: Commit and Push Any Changes
        if: always()
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          
          git stash
          
          git pull origin "$BRANCH_NAME" --rebase
          
          git stash pop || true
          
          [ -f json/comment_status.json ] && git add json/comment_status.json
          [ -f json/commented.json ] && git add json/commented.json
          # Self-healing locators: persist recorded fixes and auto-corrected .txt fallbacks
          [ -f locators/changed_locators.json ] && git add locators/changed_locators.json
          [ -f locators/linkedin_locators.txt ] && git add locators/linkedin_locators.txt
          [ -f locators/chatgpt_locators.txt ] && git add locators/chatgpt_locators.txt
          
          if git diff --staged --quiet; then
            echo "No new state changes to commit."
          else
            git commit -m "chore: update linkedin automation history state [skip ci]"
            
            git pull origin "$BRANCH_NAME" --rebase
            git push origin "$BRANCH_NAME"
          fi
